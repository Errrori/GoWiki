<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{{.Title}}</title>
		<style>
			:root {
				color-scheme: light;
				--bg: #f6f4ef;
				--panel: #ffffff;
				--ink: #1d1d1f;
				--muted: #6b6b6f;
				--accent: #c6532a;
				--accent-ink: #ffffff;
				--border: #e0d8cc;
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				font-family: "Georgia", "Times New Roman", serif;
				background: radial-gradient(circle at top, #fff7ea, var(--bg));
				color: var(--ink);
			}
			header {
				padding: 32px 20px 8px;
				text-align: center;
			}
			header h1 {
				margin: 0;
				font-size: 32px;
				letter-spacing: 0.3px;
			}
			header nav {
				margin-top: 10px;
				font-size: 14px;
			}
			header a {
				color: var(--accent);
				text-decoration: none;
				font-weight: 600;
			}
			main {
				max-width: 860px;
				margin: 0 auto 40px;
				padding: 0 20px;
			}
			.panel {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 16px;
				padding: 24px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
			}
			.content {
				font-family: "Courier New", monospace;
				font-size: 14px;
				line-height: 1.6;
				white-space: pre-wrap;
				margin: 0;
			}
			footer {
				text-align: center;
				color: var(--muted);
				font-size: 12px;
				padding-bottom: 32px;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>{{.Title}}</h1>
			<nav>
				<a href="/edit/{{.Title}}">Edit this page</a>
			</nav>
		</header>
		<main>
			<section class="panel">
				<pre class="content">{{printf "%s" .Body}}</pre>
			</section>
		</main>
		<footer>Go Wiki</footer>
	</body>
</html>
